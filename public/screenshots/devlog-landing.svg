<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0B0C0E; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <radialGradient id="landingGlow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#141924" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0B0C0E" stop-opacity="1" />
    </radialGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#landingGlow)" />

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
  <line x1="0" y1="1" x2="1440" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

  <g transform="translate(64, 16)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" />
    <path d="M9 12 L14 16 L9 20" stroke="#E8E8EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="16" y1="20" x2="23" y2="20" stroke="#E8E8EA" stroke-width="2" stroke-linecap="round" />
    <text x="44" y="22" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#E8E8EA" letter-spacing="-0.5">DevLog</text>
  </g>

  <!-- Sign in button in topbar -->
  <g transform="translate(1220, 16)">
    <rect x="0" y="0" width="156" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="78" y="20" font-size="12" font-weight="500" fill="#E8E8EA" text-anchor="middle">Sign In with Google</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(270, 140)" text-anchor="middle">
    <!-- Version Tag -->
    <rect x="375" y="0" width="150" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08" />
    <circle cx="390" cy="13" r="3.5" fill="#6EA8FE" />
    <text x="454" y="17" font-size="11" font-weight="500" fill="#E8E8EA" text-anchor="middle">Engineering Journal v2.0</text>

    <!-- Main Title -->
    <text x="450" y="80" font-size="44" font-weight="700" fill="#E8E8EA" letter-spacing="-1">
      Turn frantic debugging into an
    </text>
    <text x="450" y="136" font-size="44" font-weight="700" fill="#E8E8EA" letter-spacing="-1">
      indexed engineering knowledge base.
    </text>

    <!-- Subtitle -->
    <text x="450" y="186" font-size="16" fill="#9A9AA2" text-anchor="middle">
      <tspan x="450" dy="0">Converse freely with Gemini to dissect complex bugs, then automatically distill</tspan>
      <tspan x="450" dy="24">structured root cause schemas saved to your private Firestore repository.</tspan>
    </text>

    <!-- CTA Button -->
    <g transform="translate(330, 240)">
      <rect x="0" y="0" width="240" height="44" rx="10" fill="#6EA8FE" filter="url(#panelShadow)" />
      <circle cx="44" cy="22" r="10" fill="#FFFFFF" fill-opacity="0.2" />
      <!-- Google 'G' glyph stylized -->
      <text x="44" y="26" font-size="12" font-weight="700" fill="#0B0C0E" text-anchor="middle">G</text>
      <text x="134" y="27" font-size="13" font-weight="600" fill="#0B0C0E" text-anchor="middle">Start Session with Google</text>
    </g>

    <text x="450" y="316" font-size="11" fill="#9A9AA2">Firebase Authentication &bull; Strict Owner Isolation &bull; Gemini 2.5 Flash</text>
  </g>

  <!-- 3 Architectural Pillars in Glass Panels -->
  <g transform="translate(180, 520)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="220" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" filter="url(#panelShadow)" />
      <line x1="14" y1="1" x2="326" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <g transform="translate(24, 24)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" />
        <path d="M10 13 L14 16 L10 19 M16 19 L21 19" stroke="#E8E8EA" stroke-width="1.8" stroke-linecap="round" fill="none" />
        <text x="0" y="60" font-size="14" font-weight="600" fill="#E8E8EA">Rubber-Duck Debugging</text>
        <text x="0" y="86" font-size="12" fill="#9A9AA2" width="292">
          <tspan x="0" dy="0">Multi-turn technical dialog to</tspan>
          <tspan x="0" dy="18">diagnose memory leaks, race conditions,</tspan>
          <tspan x="0" dy="18">and database deadlocks with full context.</tspan>
        </text>
      </g>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="220" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" filter="url(#panelShadow)" />
      <line x1="14" y1="1" x2="326" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <g transform="translate(24, 24)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" />
        <circle cx="16" cy="16" r="7" stroke="#E8E8EA" stroke-width="1.8" fill="none" />
        <text x="0" y="60" font-size="14" font-weight="600" fill="#E8E8EA">Structured Schema Extraction</text>
        <text x="0" y="86" font-size="12" fill="#9A9AA2">
          <tspan x="0" dy="0">Gemini JSON mode parses conversation</tspan>
          <tspan x="0" dy="18">into root causes, resolutions, tags,</tspan>
          <tspan x="0" dy="18">difficulty, and language metadata.</tspan>
        </text>
      </g>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="220" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" filter="url(#panelShadow)" />
      <line x1="14" y1="1" x2="326" y2="1" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
      <g transform="translate(24, 24)">
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" />
        <circle cx="16" cy="16" r="8" stroke="#E8E8EA" stroke-width="1.8" fill="none" />
        <circle cx="16" cy="16" r="3" fill="#6EA8FE" />
        <text x="0" y="60" font-size="14" font-weight="600" fill="#E8E8EA">Pattern Radar</text>
        <text x="0" y="86" font-size="12" fill="#9A9AA2">
          <tspan x="0" dy="0">Aggregates failure vectors across your</tspan>
          <tspan x="0" dy="18">personal codebase to surface recurrent</tspan>
          <tspan x="0" dy="18">architectural anti-patterns.</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
